[versions]
agp = "9.2.1"
kotlin = "2.3.21"
ksp = "2.3.9"

jellyfinMedia3Ffmpeg = "1.9.0+1"
koin = "4.2.2"
mokoMvvm = "0.16.1"
mokoResources = "0.26.3"
composeUi = "1.11.3"
composeMaterial3 = "1.4.0"
composeMaterialIcons = "1.7.8"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.9.8"
constraintLayout = "2.2.1"
coordinatorLayout = "1.3.0"
preference = "1.2.1"
