apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'kotlin-kapt'

def currentTimestamp = System.currentTimeMillis()

android {
    compileSdk 37
    buildToolsVersion = '37.0.0'

    defaultConfig {
        minSdkVersion 29
        targetSdk 37

        versionCode = currentTimestamp.intdiv(1000)
        versionName = "1.0." + currentTimestamp

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation": "$projectDir/schemas".toString(),
                        "room.incremental"   : "true"
                ]
            }
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    splits {
        abi {
            enable true
            reset()
            //noinspection ChromeOsAbiSupport
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk false
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs (for IzzyOnDroid/F-Droid)
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles (for Google Play)
        includeInBundle = false
    }

    flavorDimensions += "default"

    productFlavors {
        tempus {
            dimension = "default"
            applicationId 'com.eddyizm.tempus'
        }

        degoogled {
            dimension = "default"
            applicationId "com.eddyizm.degoogled.tempus"
        }
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        compose true
    }

    namespace 'com.cappielloantonio.tempo'
}

dependencies {
    // FFmpeg Decoder (Jellyfin prebuilt)
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:1.9.0+1"

    // Koin
    implementation "io.insert-koin:koin-android:4.2.2"
    implementation "io.insert-koin:koin-androidx-compose:4.2.2"

    // Moko
    implementation "dev.icerock.moko:mvvm-core:0.16.1"
    implementation "dev.icerock.moko:mvvm-flow:0.16.1"
    implementation "dev.icerock.moko:mvvm-livedata:0.16.1"
    implementation "dev.icerock.moko:resources:0.26.3"
    implementation "dev.icerock.moko:resources-compose:0.26.3"
    testImplementation "dev.icerock.moko:resources-test:0.26.3"

    // Compose
    implementation "androidx.compose.ui:ui:1.11.3"
    implementation "androidx.compose.material3:material3:1.4.0"
    implementation "androidx.compose.ui:ui-tooling-preview:1.11.3"
    debugImplementation "androidx.compose.ui:ui-tooling:1.11.3"
    implementation "androidx.compose.runtime:runtime-livedata:1.11.3"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0"
    implementation "androidx.navigation:navigation-compose:2.9.8"

    // AndroidX
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    implementation 'androidx.documentfile:documentfile:1.1.0'

    // Android Material
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'

    // Coil
    implementation "io.coil-kt.coil3:coil:3.5.0"
    implementation "io.coil-kt.coil3:coil-compose:3.5.0"
    implementation "io.coil-kt.coil3:coil-network-okhttp:3.5.0"

    // Media3
    implementation 'androidx.media3:media3-session:1.10.1'
    implementation 'androidx.media3:media3-common:1.10.1'
    implementation 'androidx.media3:media3-exoplayer:1.10.1'
    implementation 'androidx.media3:media3-ui:1.10.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.10.1'
    tempusImplementation 'androidx.media3:media3-cast:1.10.1'

    kapt 'androidx.room:room-compiler:2.8.4'

    // Gson (Direct dependency since Retrofit is removed)
    implementation 'com.google.code.gson:gson:2.14.0'

    // OkHttp (Used for ClientCertManager and other utilities)
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'

    // Ktor
    def ktor_version = "2.3.12"
    implementation "io.ktor:ktor-client-android:$ktor_version"
    implementation "io.ktor:ktor-client-content-negotiation:$ktor_version"
    implementation "io.ktor:ktor-serialization-gson:$ktor_version"
    implementation "io.ktor:ktor-client-logging:$ktor_version"

    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'cat.ereza:customactivityoncrash:2.4.0'
    implementation 'com.facebook.shimmer:shimmer:0.5.0@aar'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.3.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

kapt {
    correctErrorTypes = true
}
